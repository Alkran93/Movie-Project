{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1 class="text-center mb-4">Latest News</h1>
    <div class="row">
        {% for article in news %}
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="row g-0">
                        <div class="col-md-8">
                            <div class="card-body">
                                <h5 class="card-title">{{ article.headline }}</h5>
                                <p class="card-text">{{ article.body }}</p>
                                    <p class="card-text">
                                    <small class="text-muted">
                                        Published on: {{ article.published_date|date:"F j, Y" }}
                                    </small>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        {% empty %}
            <div class="col-12">
                <p>No news available.</p>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
