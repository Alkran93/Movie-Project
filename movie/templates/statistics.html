<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies Statistics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
        }

        .container {
            max-width: 900px;
            margin-top: 50px;
        }

        .btn-gray {
            background-color: #6c757d;
            border-color: #6c757d;
            padding: 10px 30px;
            font-size: 16px;
            border-radius: 50px;
        }

        .btn-gray:hover {
            background-color: #5a6268;
            border-color: #545b62;
        }

        h1 {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 30px;
        }

        .img-fluid {
            border: 3px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        footer {
            background-color: #f1f1f1;
            padding: 10px 0;
            margin-top: 50px;
            text-align: center;
        }

        footer h4 {
            color:rgb(16, 15, 17);
            margin-bottom: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="text-center">Movies per Year</h1>

            <div class="text-center">
            <img src="data:image/png;base64,{{ graphic }}" alt="Movies per Year Graph" class="img-fluid">
        </div>

        <div class="mt-4 text-center">
            <a href="{% url 'home' %}" class="btn btn-gray">Back to Home</a>
        </div>
    </div>

    <footer>
        <div>
            <h4>© 2025 Copyright - Sofia Zapata Zuluaga</h4>
        </div>
    </footer>

</body>
</html>
